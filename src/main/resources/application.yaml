spring:
  application:
    name: oficina-mecanica
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DB_USERNAME:oficina}
    password: ${DB_PASSWORD:oficina123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

mail:
  from: ${MAIL_FROM:oficina@localhost}

notifications:
  # Escolhe o adapter de e-mail (EmailPort): "smtp" (síncrono, local/dev) ou
  # "pubsub" (assíncrono, nuvem). Um valor explícito em vez de inferir pela
  # presença de spring.mail.host, que sempre resolve para um default e não
  # serve como sinal confiável de "SMTP está configurado de verdade".
  email-provider: ${EMAIL_PROVIDER:noop}

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFN5c3RlbU9maWNpbmFNZWNhbmljYTIwMjQ=}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${SERVER_PORT:8080}
  # Em nuvem, o TLS termina no Load Balancer do Google — o tráfego LB→pod é
  # HTTP puro. Sem isso, o Spring acha que toda requisição é HTTP (usa
  # request.getScheme() cru) e o Swagger UI gera server URLs como
  # "http://...", que o navegador bloqueia por mixed content numa página
  # carregada via HTTPS. Isso faz o Spring confiar no X-Forwarded-Proto que
  # o GCLB já envia.
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  writer-with-default-pretty-printer: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: Oficina Mecânica API
    version: 2.0.0
    description: Sistema Integrado de Atendimento e Execução de Serviços - Fase 2

logging:
  level:
    br.com.fiap: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
