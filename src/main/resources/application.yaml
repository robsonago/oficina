spring:
  application:
    name: oficina-mecanica
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DB_USERNAME:oficina}
    password: ${DB_PASSWORD:oficina123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── Fase 4: mensageria da saga ───────────────────────────────────────────────
mensageria:
  # pubsub: GCP (ou emulador local, com PUBSUB_EMULATOR_HOST) | memoria: sem broker (testes)
  provider: ${MENSAGERIA_PROVIDER:memoria}
  project-id: ${PUBSUB_PROJECT_ID:oficina-local}
  emulador-host: ${PUBSUB_EMULATOR_HOST:}
  assinatura: ${PUBSUB_ASSINATURA_EVENTOS:oficina-os-eventos-local-os}
  topicos:
    billing-comandos: ${PUBSUB_TOPICO_BILLING_COMANDOS:oficina-billing-comandos-local}
    execucao-comandos: ${PUBSUB_TOPICO_EXECUCAO_COMANDOS:oficina-execucao-comandos-local}
  outbox:
    intervalo-ms: ${OUTBOX_INTERVALO_MS:1000}

saga:
  # quanto tempo cada etapa pode ficar esperando antes de a saga ser compensada
  prazo-orcamento: ${SAGA_PRAZO_ORCAMENTO:PT5M}
  prazo-aprovacao: ${SAGA_PRAZO_APROVACAO:PT72H}
  prazo-pagamento: ${SAGA_PRAZO_PAGAMENTO:PT48H}
  intervalo-verificacao-ms: ${SAGA_INTERVALO_VERIFICACAO_MS:60000}

# Chamadas REST síncronas (só leitura, para a visão consolidada da OS)
servicos:
  billing-url: ${BILLING_URL:http://localhost:8081}
  execucao-url: ${EXECUCAO_URL:http://localhost:8082}
  timeout-ms: ${SERVICOS_TIMEOUT_MS:2000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
    instances:
      billing:
        base-config: default
      execucao:
        base-config: default

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFN5c3RlbU9maWNpbmFNZWNhbmljYTIwMjQ=}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${SERVER_PORT:8080}
  # Em nuvem, o TLS termina no Load Balancer do Google — o tráfego LB→pod é
  # HTTP puro. Sem isso, o Spring acha que toda requisição é HTTP (usa
  # request.getScheme() cru) e o Swagger UI gera server URLs como
  # "http://...", que o navegador bloqueia por mixed content numa página
  # carregada via HTTPS. Isso faz o Spring confiar no X-Forwarded-Proto que
  # o GCLB já envia.
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  writer-with-default-pretty-printer: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Oficina Mecânica - OS Service
    version: 4.0.0
    description: Ordens de serviço, cadastros e orquestração da saga - Fase 4

logging:
  level:
    br.com.fiap: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
