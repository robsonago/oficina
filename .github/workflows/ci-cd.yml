name: CI/CD — Oficina Mecânica

on:
  push:
    branches: [main, "feature/2-fase"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oficina-app
  CLUSTER_NAME: oficina

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — Build + Testes
  # ─────────────────────────────────────────
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Permissão de execução do mvnw
        run: chmod +x ./mvnw

      - name: Build e execução dos testes
        run: ./mvnw verify

      - name: Upload relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

  # ─────────────────────────────────────────
  # JOB 2 — Build e Push da imagem Docker
  # ─────────────────────────────────────────
  docker-build-push:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # ─────────────────────────────────────────
  # JOB 3 — Deploy no Kubernetes via kind
  # ─────────────────────────────────────────
  deploy:
    name: Deploy no Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.33.0'

      - name: Criar cluster kind
        run: kind create cluster --name ${{ env.CLUSTER_NAME }} --config scripts/kind-config.yaml

      - name: Instalar metrics-server (necessário para HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system \
            --type='json' \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: Login no GHCR para pull da imagem
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull da imagem e carregamento no kind
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          docker tag  ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          kind load docker-image ${{ env.IMAGE }}:latest --name ${{ env.CLUSTER_NAME }}

      - name: Aplicar namespace e configurações
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml

      - name: Deploy do banco de dados (PostgreSQL)
        run: |
          kubectl apply -f k8s/deployment-postgres.yaml
          kubectl apply -f k8s/service-postgres.yaml

      - name: Aguardar banco de dados ficar pronto
        run: kubectl -n oficina rollout status deployment/postgres --timeout=120s

      - name: Deploy do Mailhog
        run: |
          kubectl apply -f k8s/deployment-mailhog.yaml
          kubectl apply -f k8s/service-mailhog.yaml

      - name: Deploy da aplicação
        run: |
          kubectl apply -f k8s/deployment-app.yaml
          kubectl apply -f k8s/service-app.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar aplicação ficar pronta
        run: kubectl -n oficina rollout status deployment/oficina-app --timeout=600s

      - name: Status dos pods
        run: kubectl -n oficina get pods -o wide

      - name: Status do HPA
        run: kubectl -n oficina get hpa

      - name: Smoke test — health check da API
        run: |
          kubectl -n oficina port-forward svc/oficina-app 8080:8080 &
          sleep 8
          curl -f http://localhost:8080/actuator/health | jq .

      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: |
          kubectl -n oficina get events --sort-by='.lastTimestamp'
          kubectl -n oficina logs -l app=oficina-app --tail=80 || true
          kubectl -n oficina describe pods -l app=oficina-app || true
