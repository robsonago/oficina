name: CI/CD — Oficina Mecânica

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, homolog]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oficina-app
  GCP_PROJECT_ID: oficina-501820
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/863475645726/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_SERVICE_ACCOUNT: github-actions-ci@oficina-501820.iam.gserviceaccount.com
  GKE_CLUSTER: oficina-gke
  GKE_ZONE: southamerica-east1-a

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — Build + Testes
  # ─────────────────────────────────────────
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Permissão de execução do mvnw
        run: chmod +x ./mvnw

      - name: Build e execução dos testes
        run: ./mvnw verify

      - name: Upload relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

  # ─────────────────────────────────────────
  # JOB 2 — Build e Push da imagem Docker
  # ─────────────────────────────────────────
  docker-build-push:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}

  # ─────────────────────────────────────────
  # JOB 3 — Deploy no GKE
  # homolog -> namespace oficina-homolog · main -> namespace oficina-producao
  # ─────────────────────────────────────────
  deploy:
    name: Deploy no GKE
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Autenticar no GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Obter credenciais do cluster GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Definir namespace de destino
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "namespace=oficina-producao" >> "$GITHUB_OUTPUT"
          else
            echo "namespace=oficina-homolog" >> "$GITHUB_OUTPUT"
          fi

      - name: Atualizar a imagem do Deployment
        run: |
          kubectl set image deployment/oficina-app \
            oficina-app=${{ env.IMAGE }}:${{ github.sha }} \
            -n ${{ steps.target.outputs.namespace }}

      - name: Aguardar o rollout
        run: |
          kubectl rollout status deployment/oficina-app \
            -n ${{ steps.target.outputs.namespace }} --timeout=300s
