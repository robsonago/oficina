name: CI/CD — Oficina Mecânica

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oficina-app
  CLUSTER_NAME: oficina

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — Build + Testes
  # ─────────────────────────────────────────
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Permissão de execução do mvnw
        run: chmod +x ./mvnw

      - name: Build e execução dos testes
        run: ./mvnw verify

      - name: Upload relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

  # ─────────────────────────────────────────
  # JOB 2 — Build e Push da imagem Docker
  # ─────────────────────────────────────────
  docker-build-push:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # ─────────────────────────────────────────
  # JOB 3 — Deploy no Kubernetes via Terraform (kind)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy no Kubernetes (Terraform + kind)
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.33.0'

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Login no GHCR para pull da imagem
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply — cluster, banco, mailpit e aplicação
        working-directory: infra
        run: terraform apply -auto-approve
        env:
          TF_VAR_app_image: ${{ env.IMAGE }}:${{ github.sha }}
          TF_VAR_build_local_image: "false"
          TF_VAR_ghcr_username: ${{ github.actor }}
          TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Status dos pods
        run: kubectl --context kind-${{ env.CLUSTER_NAME }} -n oficina get pods -o wide

      - name: Status do HPA
        run: kubectl --context kind-${{ env.CLUSTER_NAME }} -n oficina get hpa

      - name: Smoke test — health check da API
        run: |
          kubectl --context kind-${{ env.CLUSTER_NAME }} -n oficina port-forward svc/oficina-app 8080:8080 &
          sleep 8
          curl -f http://localhost:8080/actuator/health | jq .

      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: |
          kubectl --context kind-${{ env.CLUSTER_NAME }} -n oficina get events --sort-by='.lastTimestamp'
          kubectl --context kind-${{ env.CLUSTER_NAME }} -n oficina logs -l app=oficina-app --tail=80 || true
          kubectl --context kind-${{ env.CLUSTER_NAME }} -n oficina describe pods -l app=oficina-app || true
