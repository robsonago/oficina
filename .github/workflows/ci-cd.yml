name: CI/CD — OS Service (oficina)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, homolog]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oficina-app
  DEPLOYMENT: oficina-app
  CONTAINER: oficina-app
  GCP_PROJECT_ID: oficina-501820
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/863475645726/locations/global/workloadIdentityPools/github-actions/providers/github
  GCP_SERVICE_ACCOUNT: github-actions-ci@oficina-501820.iam.gserviceaccount.com
  GKE_CLUSTER: oficina-gke
  GKE_ZONE: southamerica-east1-a

jobs:
  # ─────────────────────────────────────────
  # 1. Build + testes (unitários, integração, BDD) + cobertura mínima de 80%
  #    O JaCoCo quebra o build se a cobertura de linhas ficar abaixo do mínimo.
  # ─────────────────────────────────────────
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build, testes e verificação de cobertura
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          linhas = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          coberto = sum(int(l["LINE_COVERED"]) for l in linhas)
          perdido = sum(int(l["LINE_MISSED"]) for l in linhas)
          print(f"### Cobertura de linhas: {100 * coberto / (coberto + perdido):.1f}% (mínimo exigido: 80%)")
          PY
          fi

      - name: Relatórios de teste e cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/cucumber-report.html
          if-no-files-found: ignore

      - name: Guarda o build para a análise de qualidade
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: target/
          retention-days: 1

  # ─────────────────────────────────────────
  # 2. Qualidade de código (SonarCloud) — usa as classes e o relatório de
  #    cobertura do job anterior, sem rodar os testes de novo.
  # ─────────────────────────────────────────
  quality:
    name: Qualidade (SonarCloud)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Recupera o build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: target/

      - name: Análise no SonarCloud (com Quality Gate)
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./mvnw
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar -Dsonar.qualitygate.wait=true

      - name: Aviso — SONAR_TOKEN não configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Secret SONAR_TOKEN não configurado neste repositório; análise do SonarCloud não executada."

  # ─────────────────────────────────────────
  # 3. Imagem Docker (só em push para homolog/main)
  # ─────────────────────────────────────────
  docker-build-push:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: [build-and-test, quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}

  # ─────────────────────────────────────────
  # 4. Deploy no GKE com os manifestos deste repositório (k8s/)
  #    homolog -> namespace oficina-homolog · main -> oficina-producao
  #    Só roda com a variável GKE_DEPLOY_ENABLED=true no repositório, para
  #    o pipeline não ficar vermelho enquanto o cluster estiver desligado.
  # ─────────────────────────────────────────
  deploy:
    name: Deploy no GKE
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog') && vars.GKE_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Obter credenciais do cluster GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Definir ambiente de destino
        id: alvo
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ambiente=producao" >> "$GITHUB_OUTPUT"
          else
            echo "ambiente=homolog" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar manifestos com a imagem deste commit
        run: |
          kubectl kustomize k8s/overlays/${{ steps.alvo.outputs.ambiente }} \
            | sed "s#${{ env.IMAGE }}:latest#${{ env.IMAGE }}:${{ github.sha }}#" \
            | kubectl apply -f -

      - name: Aguardar o rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT }} \
            -n oficina-${{ steps.alvo.outputs.ambiente }} --timeout=300s
