name: CI/CD — Oficina Mecânica

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oficina-app

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — Build + Testes
  # ─────────────────────────────────────────
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Permissão de execução do mvnw
        run: chmod +x ./mvnw

      - name: Build e execução dos testes
        run: ./mvnw verify

      - name: Upload relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

  # ─────────────────────────────────────────
  # JOB 2 — Build e Push da imagem Docker
  # ─────────────────────────────────────────
  docker-build-push:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
