version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U oficina" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: oficina-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/oficina
      DB_USERNAME: oficina
      DB_PASSWORD: oficina123
      JWT_SECRET: bXlTdXBlclNlY3JldEtleUZvckpXVFN5c3RlbU9maWNpbmFNZWNhbmljYTIwMjQ=
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
